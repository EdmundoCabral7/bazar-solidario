services:
  db:
    image: postgres:16-alpine
    container_name: bazar-db
    environment:
      POSTGRES_USER: bazar
      POSTGRES_PASSWORD: bazar
      POSTGRES_DB: bazar
    ports:
      - '5433:5432'
    volumes:
      - bazar-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazar']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bazar-db-data:
